<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crotchet I/II Generator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #9ca3af;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        touch-action: manipulation;
      }

      .app {
        height: 100dvh;
        overflow: hidden;
        touch-action: manipulation;
      }

      .rows-container {
        height: 100%;
        overflow-y: auto;
        padding: 12px;
        padding-bottom: 220px;
      }

      .row-card {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 10px;
      }

      .row-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .row-title {
        font-size: 13px;
        font-weight: 600;
      }

      .row-head-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .row-complete {
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 12px;
      }

      .row-remove {
        border: 1px solid #f3c4c4;
        background: #fff;
        color: #9f1239;
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 12px;
      }

      .row-track {
        overflow-x: auto;
        white-space: nowrap;
        padding-bottom: 2px;
      }

      .row-instruction {
        margin-top: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #374151;
      }

      .token {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 26px;
        margin-right: 1px;
        border-radius: 6px;
        border: 1px solid transparent;
        font-weight: 600;
        font-size: 12px;
        line-height: 1;
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }

      .separator {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 8px;
        font-size: 11px;
        color: #6b7280;
        font-weight: 500;
      }

      .token.done {
        color: var(--muted);
      }

      .separator.done {
        color: #c0c4cc;
      }

      .token.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: #0f172a;
      }

      .empty {
        text-align: center;
        color: #6b7280;
        padding: 36px 12px;
      }

      .controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid var(--border);
        padding: 12px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
        backdrop-filter: blur(6px);
      }

      .controls-grid {
        display: grid;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .row.single {
        grid-template-columns: 1fr;
      }

      .controls input[type="number"],
      .controls button {
        width: 100%;
        min-height: 42px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 14px;
      }

      .controls input[type="number"] {
        padding: 0 10px;
        background: #fff;
      }

      .controls button {
        background: #fff;
        font-weight: 600;
      }

      .controls button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      #clearProgressBtn {
        width: auto;
        min-height: 32px;
        justify-self: end;
        padding: 0 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="rowsContainer" class="rows-container"></div>

      <div class="controls">
        <div class="controls-grid">
          <div class="row">
            <input id="countInput" type="number" min="1" step="1" value="5" />
            <button id="generateMoreBtn" class="primary">➕ Згенерувати ще рядки</button>
          </div>
          <div class="row">
            <button id="undoBtn">↩️ Скасувати</button>
            <button id="completeBtn" class="primary">✅ Позначити виконаним</button>
          </div>
          <div class="row single">
            <button id="clearProgressBtn">🧹 Очистити прогрес</button>
          </div>
        </div>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
